<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Roboto, Arial, sans-serif; }
  html,body { width:1920px; height:1080px; overflow:hidden; }
  body.night { background:linear-gradient(160deg,#0b0d12 0%,#141821 55%,#1a140f 100%); color:#f2f3f5; }
  body.day   { background:linear-gradient(160deg,#fdf3e3 0%,#f6ecdc 55%,#eef3f7 100%); color:#23272e; }
  .wrap { padding:64px 84px; height:100%; display:flex; flex-direction:column; }

  /* top bar */
  .topbar { display:flex; justify-content:space-between; align-items:flex-start; }
  .brand { display:flex; align-items:center; gap:18px; }
  .logo { width:54px; height:54px; border-radius:16px; background:linear-gradient(145deg,#ffb03a,#ff8a1e);
          display:flex; align-items:center; justify-content:center; font-size:30px; }
  .brand h1 { font-size:40px; font-weight:600; letter-spacing:.5px; }
  .brand small { display:block; font-size:17px; font-weight:400; opacity:.62; margin-top:2px; }
  .clockbox { text-align:right; }
  .clock { font-size:44px; font-weight:600; }
  .date { font-size:19px; opacity:.62; margin-top:2px; }
  .modechip { margin-top:12px; display:inline-block; padding:7px 16px; border-radius:999px; font-size:16px;
              border:1.5px solid #ff8a1e; color:#ff8a1e; font-weight:600; }

  .section { margin-top:44px; }
  .section h2 { font-size:21px; font-weight:600; opacity:.75; letter-spacing:2.5px; text-transform:uppercase; }
  .row { display:flex; gap:26px; margin-top:20px; }

  .tile { border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
          position:relative; }
  body.night .tile { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.22);
                     box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
  body.day .tile   { background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.9);
                     box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 6px 18px rgba(120,90,40,.10); }
  .tile.big { width:330px; height:196px; }
  .tile.small { width:252px; height:158px; }
  .tile .ic { width:76px; height:76px; border-radius:20px; display:flex; align-items:center; justify-content:center;
              font-size:34px; font-weight:700; color:#fff; }
  .tile.small .ic { width:58px; height:58px; border-radius:16px; font-size:26px; }
  .tile span { font-size:22px; font-weight:500; }
  .tile.small span { font-size:19px; }

  .tile.focused { transform:scale(1.06); z-index:2; }
  body.night .tile.focused { background:rgba(255,255,255,.13); box-shadow:0 0 0 3px #ff8a1e, 0 18px 44px rgba(0,0,0,.5); }
  body.day .tile.focused { background:rgba(255,255,255,.85); box-shadow:0 0 0 3px #ff8a1e, 0 18px 44px rgba(140,100,40,.25); }

  .yt { background:#e5322d; } .nf { background:#141414; color:#e50914 !important; }
  .wetv { background:#0e3a5d; } .vidio { background:#e40046; } .dplus { background:#1b2a6b; }
  .prime { background:#00a8e1; } .spot { background:#1db954; } .set { background:#5b6470; }
  .hint { margin-top:auto; font-size:17px; opacity:.5; }
  .hint b { color:#ff8a1e; font-weight:600; }
</style>
</head>
<body class="night">
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">🍊</div>
      <div><h1>Orange TV</h1><small>Buat TV lamamu segar kembali</small></div>
    </div>
    <div class="clockbox">
      <div class="clock">19:30</div>
      <div class="date">Jumat, 23 Oktober 2026</div>
      <div class="modechip" id="modechip">Mode Malam</div>
    </div>
  </div>

  <div class="section">
    <h2>Favorit</h2>
    <div class="row">
      <div class="tile big focused"><div class="ic yt">▶</div><span>YouTube</span></div>
      <div class="tile big"><div class="ic nf">N</div><span>Netflix</span></div>
      <div class="tile big"><div class="ic wetv">We</div><span>WeTV</span></div>
      <div class="tile big"><div class="ic vidio">V</div><span>Vidio</span></div>
      <div class="tile big"><div class="ic spot">S</div><span>Spotify</span></div>
    </div>
  </div>

  <div class="section">
    <h2>Semua Aplikasi</h2>
    <div class="row">
      <div class="tile small"><div class="ic dplus">D+</div><span>Disney+</span></div>
      <div class="tile small"><div class="ic prime">P</div><span>Prime Video</span></div>
      <div class="tile small"><div class="ic yt">▶</div><span>YouTube Music</span></div>
      <div class="tile small"><div class="ic set">⚙</div><span>Pengaturan TV</span></div>
    </div>
  </div>

  <div class="hint">Tekan lama <b>OK</b> untuk tambah/hapus Favorit &nbsp;·&nbsp; Ganti <b>Mode Siang/Malam</b> di Pengaturan</div>
</div>
<script>
  if (new URLSearchParams(location.search).get('mode') === 'day') {
    document.body.className = 'day';
    document.getElementById('modechip').textContent = 'Mode Siang';
  }
</script>
</body>
</html>
