apply plugin: 'com.android.application'

android {
    namespace 'id.orangetv.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "id.orangetv.launcher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // v1: tanpa minify agar perilaku identik dengan build manual.
            minifyEnabled false
        }
    }
}
